<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Planex AI — Plan and Execute</title>
  <meta name="description" content="AI-assisted interior design for homeowners. Ideate, plan, quote, and execute your dream space.">
  <meta name="theme-color" content="#0a0a0a">
  <script>
    // Apply saved theme before first paint to avoid a light/dark flash.
    (function () {
      try {
        var raw = localStorage.getItem('PLANEX_AI_STATE_V1');
        var theme = raw ? (JSON.parse(raw).theme || 'light') : 'light';
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- Cloudflare Turnstile (explicit render). Harmless if no site key is set. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- Desktop sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12l2-2 7-7 7 7 2 2"></path>
            <path d="M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3"></path>
            <path d="M13 21v-5a1 1 0 00-1-1h-2a1 1 0 00-1 1v5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Planex AI</span>
          <span class="brand-tag">Plan &amp; Execute</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- injected by app.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="project-status-card">
          <div class="psc-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"></path><circle cx="12" cy="12" r="9"></circle></svg>
            <span>Your Project</span>
          </div>
          <div class="psc-name" id="psc-project-name">My Home</div>
          <div class="psc-stage">
            <span id="psc-stage-label">Ideate</span>
            <span id="psc-stage-step">1 / 4</span>
          </div>
          <div class="psc-bar"><div class="psc-bar-fill" id="psc-bar-fill" style="width:25%"></div></div>
        </div>
      </div>
    </aside>

    <!-- Main area -->
    <div class="main-area">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menu-toggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="crumbs">
          <span class="crumb-root">Planex AI</span>
          <span class="crumb-sep">/</span>
          <span class="crumb-current" id="crumb-current">Dashboard</span>
        </div>
        <div class="topbar-actions">
          <span class="badge badge-gold" id="plan-badge">Plan A · AI-assisted</span>
          <button class="btn btn-secondary btn-sm" id="workspace-toggle">Workspace</button>
          <select id="space-switcher" class="mini-select" title="Active space"></select>
          <select id="currency-select" class="mini-select" title="Currency">
            <option value="INR">₹ INR</option>
            <option value="USD">$ USD</option>
            <option value="EUR">€ EUR</option>
            <option value="AED">د.إ AED</option>
          </select>
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.35 15.35A9 9 0 018.65 3.65 9 9 0 1012 21a9 9 0 008.35-5.65z"></path></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          </button>
          <button class="icon-btn" id="reset-demo" aria-label="Reset" title="Reset demo data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
          </button>
        </div>
      </header>

      <div class="journey-line" id="journey-line"><div id="journey-line-fill"></div></div>

      <main class="view" id="app-view"><!-- injected by app.js --></main>
    </div>

    <!-- Live artifact rail (follows the AI) -->
    <aside class="artifact-rail" id="artifact-rail"><!-- injected --></aside>
  </div>

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav" id="bottom-nav"><!-- injected --></nav>

  <!-- Toast stack -->
  <div class="toast-stack" id="toast-stack"></div>

  <!-- Lightbox for image viewing -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Preview">
  </div>

  <script src="js/config.js"></script>
  <script src="js/context.js"></script>
  <script src="js/scope-library.js"></script>
  <script src="js/scope-engine.js"></script>
  <script src="js/docket-library.js"></script>
  <script src="js/docket-engine.js"></script>
  <script src="js/detail-engine.js"></script>
  <script src="js/furniture-spec.js"></script>
  <script src="js/layout-engine.js"></script>
  <script src="js/plan-generator.js"></script>
  <script src="js/drawing-engine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/ai-client.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/howitworks.js"></script>
  <script src="js/modules/project.js"></script>
  <script src="js/modules/spaces.js"></script>
  <script src="js/modules/scope.js"></script>
  <script src="js/modules/moodboard.js"></script>
  <script src="js/modules/planex-ai.js"></script>
  <script src="js/modules/design-docket.js"></script>
  <script src="js/modules/costing.js"></script>
  <script src="js/modules/quotation.js"></script>
  <script src="js/modules/execution.js"></script>
  <script src="js/modules/acts.js"></script>
  <script src="js/components/journey-rail.js"></script>
  <script src="js/components/artifact-rail.js"></script>
  <script src="js/components/copilot-drawer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
