name = "planex-ai"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --- D1 database (run: wrangler d1 create planex-ai, then paste database_id) ---
[[d1_databases]]
binding = "DB"
database_name = "planex-ai"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# --- Non-secret configuration ---
[vars]
ALLOWED_ORIGIN = "https://neeraj1605.github.io"
# Comma-separated list is supported for preview origins.
ALLOWED_ORIGINS_EXTRA = "http://localhost:8080,http://127.0.0.1:8080"
GEMINI_FLASH_MODEL = "gemini-3.6-flash"
GEMINI_LITE_MODEL = "gemini-3.5-flash-lite"
# Image generation provider: "pollinations" (free, no key). Swappable later.
IMAGE_PROVIDER = "pollinations"
DAILY_TURN_CAP = "2000"
SESSION_HOURLY_LIMIT = "30"
MAX_ATTACHMENT_BYTES = "4500000"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put TURNSTILE_SECRET
#   wrangler secret put SESSION_SIGNING_KEY
